<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CB Agent — Command Center</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@500;700;800&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500;700&family=Orbitron:wght@500;700;900&family=Press+Start+2P&family=Noto+Serif+JP:wght@600;900&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/marked/12.0.0/marked.min.js"></script>
<style>
/* ================= THEMES ================= */
:root,[data-theme="jarvis"]{
  --ink:#02080e; --ink-2:#04121c; --ink-3:#062033; --line:#0d3a55;
  --accent:#3fd0ff; --accent-dim:#1d7fa8; --accent-faint:#0b3247;
  --text:#cbeeff; --dim:#6ba7c4; --faint:#2f6d8c;
  --ok:#4fe0b0; --err:#ff8080;
  --display:'Orbitron',sans-serif; --body:'Inter',sans-serif; --mono:'JetBrains Mono',monospace;
  --radius:2px; --track:.5em; --glow:0 0 10px #3fd0ff55;
  --bg:linear-gradient(#3fd0ff0a 1px,transparent 1px),linear-gradient(90deg,#3fd0ff0a 1px,transparent 1px);
  --bg-size:44px 44px;
}
[data-theme="cb-agent"]{
  --ink:#08090b; --ink-2:#0c0e12; --ink-3:#121419; --line:#1c2128;
  --accent:#9fb3bf; --accent-dim:#5c6a74; --accent-faint:#252c33;
  --text:#d6dde2; --dim:#79838d; --faint:#4a535c;
  --ok:#7fb89a; --err:#c98787;
  --display:'Archivo',sans-serif; --body:'Inter',sans-serif; --mono:'JetBrains Mono',monospace;
  --radius:6px; --track:.4em; --glow:none;
  --bg:radial-gradient(circle,#ffffff08 1px,transparent 1px); --bg-size:26px 26px;
}
[data-theme="arc"]{
  --ink:#040f13; --ink-2:#07191e; --ink-3:#0b262d; --line:#10424b;
  --accent:#2ee6d0; --accent-dim:#178a80; --accent-faint:#0d3239;
  --text:#c9f7f0; --dim:#5fa79f; --faint:#2b6b68;
  --ok:#2ee6d0; --err:#ff7a7a;
  --display:'Orbitron',sans-serif; --body:'Inter',sans-serif; --mono:'JetBrains Mono',monospace;
  --radius:2px; --track:.5em; --glow:0 0 14px #2ee6d055;
  --bg:linear-gradient(#2ee6d008 1px,transparent 1px),linear-gradient(90deg,#2ee6d008 1px,transparent 1px);
  --bg-size:52px 52px;
}
[data-theme="mono"]{
  --ink:#000000; --ink-2:#0a0a0a; --ink-3:#141414; --line:#2a2a2a;
  --accent:#ffffff; --accent-dim:#8a8a8a; --accent-faint:#333333;
  --text:#e8e8e8; --dim:#8f8f8f; --faint:#555555;
  --ok:#ffffff; --err:#bbbbbb;
  --display:'Orbitron',sans-serif; --body:'Inter',sans-serif; --mono:'JetBrains Mono',monospace;
  --radius:1px; --track:.5em; --glow:0 0 10px #ffffff33;
  --bg:linear-gradient(#ffffff07 1px,transparent 1px),linear-gradient(90deg,#ffffff07 1px,transparent 1px);
  --bg-size:48px 48px;
}
[data-theme="voxel"]{
  --ink:#171a1c; --ink-2:#232a24; --ink-3:#2f3a30; --line:#4a5a3f;
  --accent:#8bc34a; --accent-dim:#5d7f36; --accent-faint:#3a4a30;
  --text:#e8e4d8; --dim:#a3a18f; --faint:#6e6c5c;
  --ok:#8bc34a; --err:#d16b5a;
  --display:'Press Start 2P',monospace; --body:'Inter',sans-serif; --mono:'Press Start 2P',monospace;
  --radius:0px; --track:.06em; --glow:none;
  --bg:linear-gradient(45deg,#ffffff07 25%,transparent 25%,transparent 75%,#ffffff07 75%),
       linear-gradient(45deg,#ffffff07 25%,transparent 25%,transparent 75%,#ffffff07 75%);
  --bg-size:34px 34px;
}
[data-theme="dojo"]{
  --ink:#0d0b0a; --ink-2:#151110; --ink-3:#1d1715; --line:#2e2320;
  --accent:#c8442e; --accent-dim:#8a3423; --accent-faint:#3a231d;
  --text:#e8e0d5; --dim:#9a8d80; --faint:#63584e;
  --ok:#9ab87f; --err:#c8442e;
  --display:'Noto Serif JP',serif; --body:'Inter',sans-serif; --mono:'JetBrains Mono',monospace;
  --radius:1px; --track:.3em; --glow:none;
  --bg:radial-gradient(ellipse at 25% 15%,#c8442e0d,transparent 55%),
       radial-gradient(ellipse at 80% 80%,#c8442e08,transparent 50%);
  --bg-size:100% 100%;
}
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%}
body{
  background:var(--ink); color:var(--text); font-family:var(--body); font-size:14px;
  display:grid; grid-template-rows:54px 1fr 62px; grid-template-columns:248px 1fr;
  grid-template-areas:"head head" "rail main" "chat chat";
  height:100vh; overflow:hidden; transition:background .4s,color .4s;
}
body::before{content:""; position:fixed; inset:0; pointer-events:none; z-index:0;
  background-image:var(--bg); background-size:var(--bg-size); background-position:0 0,17px 17px}
/* ===== boot ===== */
#boot{position:fixed; inset:0; z-index:100; background:var(--ink); display:flex; flex-direction:column; align-items:center; justify-content:center; gap:26px; cursor:pointer; transition:opacity .7s}
#boot.fade{opacity:0; pointer-events:none}
.boot-core{position:relative; width:110px; height:110px}
.boot-core i{position:absolute; inset:0; border:1px solid var(--accent-dim); border-radius:50%; animation:bootripple 2.4s cubic-bezier(.2,.6,.3,1) infinite}
[data-theme="voxel"] .boot-core i{border-radius:0}
.boot-core i:nth-child(2){animation-delay:.6s}
.boot-core i:nth-child(3){animation-delay:1.2s}
.boot-core i:nth-child(4){animation-delay:1.8s}
@keyframes bootripple{0%{transform:scale(.12); opacity:1; border-color:var(--accent)}100%{transform:scale(1); opacity:0; border-color:var(--accent-dim)}}
.boot-mark{font-family:var(--display); font-weight:800; font-size:22px; letter-spacing:var(--track); text-transform:uppercase; text-shadow:var(--glow)}
[data-theme="voxel"] .boot-mark{font-size:15px}
.boot-mark span{color:var(--accent)}
#bootlines{font-family:var(--mono); font-size:11px; letter-spacing:.08em; color:var(--dim); min-height:130px; width:340px; line-height:1.9}
[data-theme="voxel"] #bootlines{font-size:8px; line-height:2.4}
#bootlines .on{color:var(--ok)} #bootlines .off{color:var(--accent-dim)}
#bootlines div{opacity:0; animation:linein .3s ease forwards}
@keyframes linein{to{opacity:1}}
.boot-skip{font-family:var(--mono); font-size:9px; letter-spacing:.2em; color:var(--faint); text-transform:uppercase}
@media (prefers-reduced-motion:reduce){.boot-core i{animation:none; transform:scale(.5); opacity:.4}}
/* ===== header ===== */
header{grid-area:head; display:flex; align-items:center; gap:14px; padding:0 18px; border-bottom:1px solid var(--line); background:var(--ink); position:relative; z-index:2}
.core{position:relative; width:30px; height:30px; flex:none}
.core i{position:absolute; inset:0; border:1px solid var(--accent-dim); border-radius:50%; opacity:.85; transform:scale(.35)}
[data-theme="voxel"] .core i{border-radius:0}
.core i:nth-child(2){transform:scale(.62); opacity:.45}
.core i:nth-child(3){transform:scale(.9); opacity:.22}
.core.busy i{animation:ripple 2.2s cubic-bezier(.2,.6,.3,1) infinite}
.core.busy i:nth-child(2){animation-delay:.55s}
.core.busy i:nth-child(3){animation-delay:1.1s}
@keyframes ripple{0%{transform:scale(.3); opacity:.9; border-color:var(--accent)}100%{transform:scale(1.05); opacity:0; border-color:var(--accent-dim)}}
@media (prefers-reduced-motion:reduce){.core.busy i{animation:none; border-color:var(--accent)}}
.brand{display:flex; align-items:center; gap:14px; background:none; border:none; padding:0; cursor:pointer; color:inherit; font:inherit; text-align:left; border-radius:var(--radius)}
.brand:hover .wordmark{color:var(--accent)}
.brand:focus-visible{outline:1px solid var(--accent-dim); outline-offset:3px}
.wordmark{font-family:var(--display); font-weight:800; letter-spacing:var(--track); font-size:14px; text-transform:uppercase; text-shadow:var(--glow); transition:color .15s}
[data-theme="voxel"] .wordmark{font-size:9px}
.wordmark span{color:var(--accent)}
.sys-state{font-family:var(--mono); font-size:9.5px; color:var(--dim); letter-spacing:.16em; text-transform:uppercase}
[data-theme="voxel"] .sys-state{font-size:6px}
.sys-state b{color:var(--accent); font-weight:500}
.head-right{margin-left:auto; display:flex; align-items:center; gap:12px}
.clock{font-family:var(--mono); font-size:11px; color:var(--dim); letter-spacing:.1em; text-align:right; line-height:1.5}
[data-theme="voxel"] .clock{font-size:7px}
.clock b{color:var(--text); font-weight:500}
.conn{display:flex; gap:10px}
.conn .dot{display:flex; align-items:center; gap:5px; font-family:var(--mono); font-size:9.5px; color:var(--dim)}
[data-theme="voxel"] .conn .dot{font-size:6px}
.conn .dot::before{content:""; width:5px; height:5px; border-radius:50%; background:var(--accent-faint)}
[data-theme="voxel"] .conn .dot::before{border-radius:0; width:6px; height:6px}
.conn .dot.on::before{background:var(--ok); box-shadow:0 0 6px currentColor}
.hbtn{font-family:var(--mono); font-size:9.5px; color:var(--faint); border:1px solid var(--accent-faint); border-radius:var(--radius); padding:4px 8px; letter-spacing:.08em; cursor:pointer; background:none}
[data-theme="voxel"] .hbtn{font-size:6px; padding:5px 7px}
.hbtn:hover,.hbtn.on{color:var(--accent); border-color:var(--accent-dim)}
#scan{position:absolute; left:0; bottom:-1px; height:1px; width:100%; overflow:hidden; opacity:0; transition:opacity .3s}
#scan.busy{opacity:1}
#scan::after{content:""; position:absolute; top:0; left:-30%; width:30%; height:100%; background:linear-gradient(90deg,transparent,var(--accent),transparent); animation:scan 1.6s linear infinite}
@keyframes scan{to{left:100%}}
@media (prefers-reduced-motion:reduce){#scan::after{animation:none; left:0; width:100%; opacity:.4}}
/* HUD detailing */
.reticle{position:absolute; inset:-6px; width:calc(100% + 12px); height:calc(100% + 12px); overflow:visible; opacity:0}
[data-theme="jarvis"] .reticle{opacity:1}
.reticle circle{fill:none; stroke:var(--accent-faint); stroke-width:.8; stroke-dasharray:3 5}
.reticle path{fill:none; stroke:var(--accent); stroke-width:1.4; stroke-linecap:round; opacity:.85}
.reticle{animation:spin 14s linear infinite; transform-origin:50% 50%}
.core.busy .reticle{animation-duration:3.4s}
@keyframes spin{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion:reduce){.reticle{animation:none}}
/* corner brackets */
[data-theme="jarvis"] .tile,[data-theme="jarvis"] .latest,[data-theme="jarvis"] .opts{position:relative}
[data-theme="jarvis"] .tile::before,[data-theme="jarvis"] .tile::after,
[data-theme="jarvis"] .latest::before,[data-theme="jarvis"] .latest::after{
  content:""; position:absolute; width:9px; height:9px; border:1px solid var(--accent); opacity:.6}
[data-theme="jarvis"] .tile::before,[data-theme="jarvis"] .latest::before{
  top:-1px; left:-1px; border-right:none; border-bottom:none}
[data-theme="jarvis"] .tile::after,[data-theme="jarvis"] .latest::after{
  bottom:-1px; right:-1px; border-left:none; border-top:none}
/* ticked rule under section titles */
[data-theme="jarvis"] .dash-title{display:flex; align-items:center; gap:10px}
[data-theme="jarvis"] .dash-title::after{content:""; flex:1; height:4px;
  background-image:linear-gradient(90deg,var(--accent-faint) 1px,transparent 1px);
  background-size:7px 100%; opacity:.7}
/* readout strip */
.readout{display:flex; gap:22px; margin:-4px 0 20px; font-family:var(--mono); font-size:9.5px;
  letter-spacing:.16em; text-transform:uppercase; color:var(--faint)}
.readout b{color:var(--accent); font-weight:500}
/* viewport corner brackets */
.vframe{position:absolute; inset:12px; pointer-events:none; z-index:2}
.vframe i{position:absolute; width:24px; height:24px; border:1px solid var(--accent-dim); opacity:.5}
.vframe i:nth-child(1){top:0; left:0; border-right:0; border-bottom:0}
.vframe i:nth-child(2){top:0; right:0; border-left:0; border-bottom:0}
.vframe i:nth-child(3){bottom:0; left:0; border-right:0; border-top:0}
.vframe i:nth-child(4){bottom:0; right:0; border-left:0; border-top:0}

/* ===== HUD hero: orbital core + side panels ===== */
.hud{display:grid; grid-template-columns:1fr minmax(300px,1.1fr) 1fr; gap:22px;
  align-items:center; margin-bottom:26px; min-height:330px}
.orbit{position:relative; aspect-ratio:1; width:100%; max-width:330px; margin:0 auto;
  display:grid; place-items:center}
.orbit svg{position:absolute; inset:0; width:100%; height:100%; overflow:visible}
.ring-dash{fill:none; stroke:var(--accent-dim); stroke-width:1; stroke-dasharray:5 9; opacity:.75;
  transform-origin:50% 50%; animation:spin 26s linear infinite}
.ring-arc{fill:none; stroke:var(--accent); stroke-width:2; stroke-linecap:round; opacity:.9;
  transform-origin:50% 50%; animation:spin 15s linear infinite reverse; filter:drop-shadow(0 0 5px var(--accent))}
.ring-thin{fill:none; stroke:var(--accent-faint); stroke-width:1}
.ring-ticks{stroke:var(--accent-dim); stroke-width:1.4; opacity:.5;
  transform-origin:50% 50%; animation:spin 60s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion:reduce){.ring-dash,.ring-arc,.ring-ticks{animation:none}}
.core-orb{position:relative; width:54%; aspect-ratio:1; border-radius:50%;
  display:grid; place-items:center; text-align:center;
  filter:drop-shadow(0 0 22px var(--accent));}
.sphere{position:absolute; inset:0; width:100%; height:100%; overflow:visible;
  animation:spin 34s linear infinite; transform-origin:50% 50%}
.core-orb.busy .sphere{animation-duration:9s}
@media (prefers-reduced-motion:reduce){.sphere{animation:none}}
.sphere circle{fill:var(--accent)}
.orb-label{position:relative; z-index:2}
.orb-label b{display:block; font-family:var(--display); font-weight:900; font-size:15px;
  letter-spacing:.2em; color:var(--text); text-shadow:0 0 8px var(--ink), 0 0 8px var(--ink)}
[data-theme="voxel"] .orb-label b{font-size:9px}
.orb-label span{display:block; font-family:var(--mono); font-size:8px; letter-spacing:.24em;
  color:var(--accent); opacity:.85; margin-top:3px; text-transform:uppercase;
  text-shadow:0 0 6px var(--ink)}
.hudpanel{background:var(--ink-2); border:1px solid var(--line); border-radius:var(--radius);
  padding:13px 15px; position:relative; min-height:190px}
.hudpanel::before,.hudpanel::after{content:""; position:absolute; width:9px; height:9px;
  border:1px solid var(--accent); opacity:.5}
.hudpanel::before{top:-1px; left:-1px; border-right:0; border-bottom:0}
.hudpanel::after{bottom:-1px; right:-1px; border-left:0; border-top:0}
.hp-head{display:flex; justify-content:space-between; align-items:center; font-family:var(--mono);
  font-size:9px; letter-spacing:.2em; text-transform:uppercase; color:var(--dim);
  border-bottom:1px solid var(--line); padding-bottom:7px; margin-bottom:10px}
[data-theme="voxel"] .hp-head{font-size:6px}
.hp-head i{width:5px; height:5px; border-radius:50%; background:var(--accent); opacity:.8;
  animation:blink 2.4s ease-in-out infinite}
@keyframes blink{50%{opacity:.15}}
.feed{font-family:var(--mono); font-size:10px; line-height:1.85; color:var(--dim);
  max-height:150px; overflow-y:auto}
[data-theme="voxel"] .feed{font-size:7px}
.feed div{white-space:nowrap; overflow:hidden; text-overflow:ellipsis}
.feed .t{color:var(--accent-dim)}
.hp-foot{display:flex; justify-content:space-between; font-family:var(--mono); font-size:8px;
  letter-spacing:.14em; text-transform:uppercase; color:var(--faint); margin-top:10px;
  border-top:1px solid var(--line); padding-top:7px}
.meter{margin-bottom:13px}
.meter-top{display:flex; justify-content:space-between; font-family:var(--mono); font-size:9.5px;
  letter-spacing:.12em; text-transform:uppercase; color:var(--dim); margin-bottom:5px}
[data-theme="voxel"] .meter-top{font-size:6px}
.meter-top b{color:var(--text); font-weight:500}
.meter-bar{height:4px; background:var(--ink-3); border-radius:2px; overflow:hidden}
.meter-bar i{display:block; height:100%; background:var(--accent); box-shadow:var(--glow);
  width:0; transition:width 1.1s cubic-bezier(.3,.9,.3,1)}
/* ===== rail ===== */
nav{grid-area:rail; border-right:1px solid var(--line); background:var(--ink); padding:14px 10px; overflow-y:auto; position:relative; z-index:1}
.rail-label{display:flex; align-items:center; gap:8px; font-family:var(--mono); font-size:9px; letter-spacing:.22em; text-transform:uppercase; color:var(--faint); padding:14px 8px 6px}
[data-theme="voxel"] .rail-label{font-size:6px}
.rail-label::after{content:""; flex:1; height:1px; background:var(--line)}
.rail-label:first-child{padding-top:0}
nav button{display:flex; align-items:center; gap:9px; width:100%; text-align:left; padding:7px 8px; margin:1px 0; background:none; border:none; border-left:2px solid transparent; border-radius:0 var(--radius) var(--radius) 0; color:var(--text); font-family:var(--body); font-size:12.5px; font-weight:500; cursor:pointer; transition:background .12s,border-color .12s}
nav button:hover{background:var(--ink-3)}
nav button.active{border-left-color:var(--accent); background:var(--ink-3)}
nav button:focus-visible{outline:1px solid var(--accent); outline-offset:1px}
nav button .code{font-family:var(--mono); font-size:9px; font-weight:700; color:var(--accent-dim); background:var(--ink-2); border:1px solid var(--accent-faint); border-radius:var(--radius); padding:2px 4px; min-width:32px; text-align:center; flex:none}
[data-theme="voxel"] nav button .code{font-size:6px; padding:3px}
nav button.active .code{color:var(--accent); border-color:var(--accent-dim)}
nav button small{display:block; color:var(--dim); font-weight:400; font-size:10.5px; margin-top:1px}
/* ===== main ===== */
main{grid-area:main; overflow-y:auto; padding:24px 32px; position:relative; z-index:1}
.opts{display:flex; gap:10px; flex-wrap:wrap; margin-bottom:18px; padding:12px; background:var(--ink-2); border:1px solid var(--line); border-radius:var(--radius)}
.opts select,.opts input{background:var(--ink); border:1px solid var(--accent-faint); color:var(--text); padding:7px 10px; border-radius:var(--radius); font-family:var(--mono); font-size:12px}
[data-theme="voxel"] .opts select,[data-theme="voxel"] .opts input{font-size:8px}
.opts input{width:240px}
.opts .go{background:var(--accent); color:var(--ink); border:none; padding:8px 18px; border-radius:var(--radius); font-family:var(--display); font-weight:700; font-size:11.5px; letter-spacing:.08em; text-transform:uppercase; cursor:pointer; box-shadow:var(--glow)}
[data-theme="voxel"] .opts .go{font-size:8px; padding:9px 14px}
#out{max-width:860px; line-height:1.65}
#out h1,#out h2,#out h3{font-family:var(--display); font-weight:700; margin:22px 0 8px}
#out h1{font-size:19px} #out h2{font-size:15px; border-bottom:1px solid var(--line); padding-bottom:6px} #out h3{font-size:13.5px}
[data-theme="voxel"] #out h1{font-size:12px} [data-theme="voxel"] #out h2{font-size:10px} [data-theme="voxel"] #out h3{font-size:9px}
#out p{margin:8px 0} #out ul,#out ol{margin:8px 0 8px 20px} #out li{margin:4px 0}
#out strong{color:var(--accent)}
#out code{font-family:var(--mono); font-size:12px; background:var(--ink-3); padding:1px 5px; border-radius:var(--radius)}
#out pre{background:var(--ink-2); border:1px solid var(--line); padding:12px; border-radius:var(--radius); overflow-x:auto; margin:10px 0}
.running{display:flex; gap:10px; color:var(--accent); font-family:var(--mono); font-size:11.5px; letter-spacing:.12em; text-transform:uppercase}
.dash-title{font-family:var(--mono); font-size:9.5px; letter-spacing:.22em; text-transform:uppercase; color:var(--faint); margin:0 0 10px}
[data-theme="voxel"] .dash-title{font-size:6px}
.tiles{display:grid; grid-template-columns:repeat(auto-fill,minmax(150px,1fr)); gap:10px; margin-bottom:26px; max-width:860px}
.tile{background:var(--ink-2); border:1px solid var(--line); border-radius:var(--radius); padding:12px 14px}
[data-theme="voxel"] .tile{box-shadow:inset -3px -3px 0 #00000045,inset 3px 3px 0 #ffffff10}
.tile .t-code{font-family:var(--mono); font-size:9px; color:var(--faint); text-transform:uppercase; display:flex; justify-content:space-between; align-items:center}
[data-theme="voxel"] .tile .t-code{font-size:6px}
.tile .t-name{font-family:var(--display); font-weight:700; font-size:13px; margin-top:6px}
[data-theme="voxel"] .tile .t-name{font-size:7.5px; margin-top:9px}
.tile .t-state{font-family:var(--mono); font-size:10px; margin-top:3px}
[data-theme="voxel"] .tile .t-state{font-size:6px; margin-top:7px}
.tile .t-state.on{color:var(--ok)} .tile .t-state.off{color:var(--accent-dim)}
.tile .led{width:6px; height:6px; border-radius:50%; background:var(--accent-faint)}
[data-theme="voxel"] .tile .led{border-radius:0; width:7px; height:7px}
.tile .led.on{background:var(--ok); box-shadow:0 0 8px currentColor}
.quick{display:flex; gap:8px; flex-wrap:wrap; margin-bottom:26px}
.quick button{background:var(--ink-2); border:1px solid var(--line); color:var(--text); border-radius:20px; padding:7px 14px; font-family:var(--body); font-size:12px; cursor:pointer}
[data-theme="voxel"] .quick button{border-radius:0; box-shadow:inset -3px -3px 0 #00000045,inset 3px 3px 0 #ffffff10}
.quick button:hover{border-color:var(--accent-dim)}
.latest{background:var(--ink-2); border:1px solid var(--line); border-radius:var(--radius); padding:16px 18px; max-width:860px; cursor:pointer}
.latest:hover{border-color:var(--accent-dim)}
.latest .l-head{display:flex; justify-content:space-between; font-family:var(--mono); font-size:9.5px; letter-spacing:.16em; text-transform:uppercase; color:var(--faint); margin-bottom:8px}
.latest .l-body{color:var(--dim); font-size:13px; line-height:1.6; max-height:120px; overflow:hidden; -webkit-mask-image:linear-gradient(#000 60%,transparent)}
/* ===== specialist cards ===== */
.agent-grid{display:grid; grid-template-columns:repeat(auto-fill,minmax(300px,1fr)); gap:14px; max-width:860px}
.agent-card{background:var(--ink-2); border:1px solid var(--line); border-radius:var(--radius);
  padding:15px 16px; position:relative}
.agent-card::before,.agent-card::after{content:""; position:absolute; width:9px; height:9px;
  border:1px solid var(--accent); opacity:.5}
.agent-card::before{top:-1px; left:-1px; border-right:0; border-bottom:0}
.agent-card::after{bottom:-1px; right:-1px; border-left:0; border-top:0}
.ac-top{display:flex; justify-content:space-between; align-items:baseline; gap:8px; margin-bottom:8px}
.ac-name{font-family:var(--display); font-weight:700; font-size:13.5px; letter-spacing:.04em}
[data-theme="voxel"] .ac-name{font-size:9px}
.ac-model{font-family:var(--mono); font-size:9px; color:var(--accent-dim); border:1px solid var(--accent-faint);
  border-radius:var(--radius); padding:2px 6px; white-space:nowrap}
[data-theme="voxel"] .ac-model{font-size:6px}
.ac-desc{color:var(--dim); font-size:12.5px; line-height:1.55; margin-bottom:10px}
.ac-tools{display:flex; flex-wrap:wrap; gap:5px; align-items:center; margin-bottom:12px}
.ac-tools span{font-family:var(--mono); font-size:9px; color:var(--faint); background:var(--ink-3);
  border:1px solid var(--line); border-radius:var(--radius); padding:2px 6px}
.ac-tools em{font-family:var(--mono); font-size:8.5px; color:var(--faint); font-style:normal;
  letter-spacing:.06em; width:100%; margin-top:3px; opacity:.8}
.ac-run{background:none; border:1px solid var(--accent-dim); color:var(--accent);
  font-family:var(--display); font-weight:700; font-size:10.5px; letter-spacing:.08em; text-transform:uppercase;
  padding:8px 14px; border-radius:var(--radius); cursor:pointer; box-shadow:var(--glow)}
[data-theme="voxel"] .ac-run{font-size:7px}
.ac-run:hover{background:var(--ink-3)}
/* ===== chat ===== */
.chatbar{grid-area:chat; display:flex; gap:10px; align-items:center; padding:0 18px; border-top:1px solid var(--line); background:var(--ink); position:relative; z-index:3}
.chat-prefix{font-family:var(--mono); font-size:12px; color:var(--accent-dim)}
.chatbar input{flex:1; background:var(--ink-2); border:1px solid var(--accent-faint); border-radius:var(--radius); color:var(--text); padding:11px 14px; font-family:var(--body); font-size:13.5px}
.chatbar input:focus{outline:none; border-color:var(--accent-dim)}
.chatbar button{background:none; border:1px solid var(--accent-dim); color:var(--accent); padding:10px 20px; border-radius:var(--radius); font-family:var(--display); font-weight:700; font-size:11.5px; letter-spacing:.08em; text-transform:uppercase; cursor:pointer}
[data-theme="voxel"] .chatbar button{font-size:8px}
.chat-turn{max-width:860px; margin:10px 0}
.chat-turn .who{font-family:var(--mono); font-size:9.5px; letter-spacing:.16em; text-transform:uppercase; color:var(--accent-dim); margin-bottom:4px}
.chat-turn.user .who{color:var(--accent)}
/* ===== palette + theme menu ===== */
#pal{position:fixed; inset:0; z-index:90; background:#00000099; display:none; align-items:flex-start; justify-content:center; padding-top:16vh}
#pal.open{display:flex}
.pal-box{width:520px; background:var(--ink-2); border:1px solid var(--accent-faint); border-radius:var(--radius); overflow:hidden}
.pal-box input{width:100%; background:var(--ink); border:none; border-bottom:1px solid var(--line); color:var(--text); padding:14px 16px; font-family:var(--mono); font-size:13px}
.pal-box input:focus{outline:none}
#pal-list{max-height:300px; overflow-y:auto}
#pal-list div{display:flex; align-items:center; gap:10px; padding:9px 16px; cursor:pointer; font-size:13px}
#pal-list div .code{font-family:var(--mono); font-size:9px; color:var(--accent-dim); border:1px solid var(--accent-faint); border-radius:var(--radius); padding:2px 5px; min-width:34px; text-align:center}
#pal-list div.sel,#pal-list div:hover{background:var(--ink-3)}
#pal-list small{color:var(--dim); margin-left:auto; font-size:10.5px}
#themeMenu{position:fixed; right:18px; top:54px; z-index:80; background:var(--ink-2); border:1px solid var(--accent-faint); border-radius:var(--radius); padding:6px; display:none; min-width:200px}
#themeMenu.open{display:block}
#themeMenu button{display:flex; align-items:center; gap:9px; width:100%; background:none; border:none; color:var(--text); font-family:var(--body); font-size:12.5px; padding:8px 10px; cursor:pointer; text-align:left; border-radius:var(--radius)}
#themeMenu button:hover{background:var(--ink-3)}
#themeMenu button.on{color:var(--accent)}
#themeMenu .sw{width:12px; height:12px; border-radius:50%; flex:none}
#themeMenu small{display:block; color:var(--dim); font-size:10px}
@media (max-width:760px){
  body{grid-template-columns:60px 1fr}
  nav button small,.rail-label,nav button .code{display:none}
  .conn,.clock,.sys-state{display:none}
}
</style>
</head>
<body data-theme="jarvis">

<div id="boot">
  <div class="boot-core" aria-hidden="true"><i></i><i></i><i></i><i></i></div>
  <div class="boot-mark">Alta<span>ra</span></div>

  <div class="boot-skip">click to skip</div>
</div>

<header>
  <button class="brand" id="brandHome" title="Back to home">
    <div class="core" id="core" aria-hidden="true"><i></i><i></i><i></i><svg class="reticle" viewBox="0 0 40 40"><circle cx="20" cy="20" r="17"/><path d="M20,1 A19,19 0 0,1 33,7"/><path d="M20,39 A19,19 0 0,1 7,33"/></svg></div>
    <div>
      <div class="wordmark">CB<span> Agent</span></div>
      <div class="sys-state">agent <b id="coreLabel">idle</b></div>

<main id="main">

  <div id="out"></div>
</main>

<div class="chatbar">
  <span class="chat-prefix">&gt;_</span>
  <input id="chatInput" placeholder="Ask the agent anything — strategy, copy, numbers…" autocomplete="off">
  <button id="chatSend">Send</button>
</div>

<div id="pal" role="dialog" aria-label="Command palette">
  <div class="pal-box">
    <input id="palInput" placeholder="Type a command…" autocomplete="off">
    <div id="pal-list"></div>
  </div>
</div>

<script>
const $=s=>document.querySelector(s);

/* Per-tab session id so multiple open tabs never share chat/output state.
   sessionStorage is unique per tab; a fresh tab gets a fresh session. */
const SESSION_ID=(()=>{
  try{
    let id=sessionStorage.getItem('cb_agent_session');
    if(!id){ id=(crypto.randomUUID?crypto.randomUUID():String(Math.random()).slice(2)); sessionStorage.setItem('cb_agent_session',id); }
    return id;
  }catch(e){ return String(Math.random()).slice(2); }
})();
const _fetch=window.fetch.bind(window);
window.fetch=(url,opts={})=>{
  // only tag same-origin API calls
  const u=String(url);
  if(u.startsWith('/api')||u.startsWith(location.origin+'/api')){
    opts=Object.assign({},opts);
    opts.headers=Object.assign({}, opts.headers||{}, {'X-CB-Session':SESSION_ID});
  }
  return _fetch(url,opts);
};
const md=t=>window.marked?marked.parse(t||''):'<pre style="white-space:pre-wrap;font-family:inherit;border:none;background:none;padding:0">'+(t||'').replace(/&/g,'&amp;').replace(/</g,'&lt;')+'</pre>';
const core=$('#core'),coreLabel=$('#coreLabel'),out=$('#out'),opts=$('#opts'),scan=$('#scan');
let busyCount=0,STATUS={},AGENT_COUNT=0;
function setBusy(b){
  busyCount=Math.max(0,busyCount+(b?1:-1));
  core.classList.toggle('busy',busyCount>0);
  scan.classList.toggle('busy',busyCount>0);
  const orb=document.getElementById('orb'); if(orb) orb.classList.toggle('busy',busyCount>0);
  coreLabel.textContent=busyCount>0?'thinking':'idle';
}
function tick(){const d=new Date();
  $('#clk-time').textContent=d.toLocaleTimeString([],{hour12:false});
  $('#clk-date').textContent=d.toLocaleDateString([],{weekday:'short',month:'short',day:'numeric'}).toUpperCase();}
tick(); setInterval(tick,1000);
const bootAt=Date.now();
setInterval(()=>{
  const el=document.getElementById('ro-up'); if(!el) return;
  const s=Math.floor((Date.now()-bootAt)/1000);
  el.textContent=String(Math.floor(s/60)).padStart(2,'0')+':'+String(s%60).padStart(2,'0');
  const st=document.getElementById('ro-state'); if(st) st.textContent=busyCount>0?'processing':'nominal';
},1000);

/* ===== commands, grouped — rail and palette both read this ===== */
const GROUPS=[
  {group:'Briefings',region:'frontal',label:'BRIEFINGS',items:[
    {cmd:'report',code:'RPT',name:'Daily report',desc:'content · ads · list · funnel'},
    {cmd:'weekly',code:'WKL',name:'Weekly review',desc:'list growth · recap'},
    {cmd:'debrief',code:'DBF',name:'Drop debrief',desc:'results → playbook'}]},
  {group:'Analysis',region:'parietal',label:'ANALYSIS',items:[
    {cmd:'funnel',code:'FNL',name:'Funnel',desc:'TOF / MOF / BOF mix'},
    {cmd:'ads',code:'ADS',name:'Ads',desc:'CTR · CTA · scale/kill'},
    {cmd:'competitors',code:'CMP',name:'Competitors',desc:'patterns → adaptations'},
    {cmd:'advise',code:'ADV',name:'Advise',desc:'marketing audit'}]},
  {group:'Create',region:'temporal',label:'CREATE',items:[
    {cmd:'content',code:'CNT',name:'Content',desc:'concepts by stage'},
    {cmd:'videos',code:'VID',name:'Video ideas',desc:'100 fresh + top 10'},
    {cmd:'ideas',code:'OPP',name:'Ideas',desc:'opportunity scan'},
    {cmd:'watch',code:'WCH',name:'Watch video',desc:'analyze any link'}]},
  {group:'Specialists',label:'SPECIALISTS',items:[
    {cmd:'run_agent',code:'SUB',name:'Subagent',desc:'run a specialist persona'},
    {cmd:'agents',code:'LST',name:'List agents',desc:'installed specialists'}]},
];
const COMMANDS=GROUPS.flatMap(g=>g.items);

/* ===== themes ===== */
const THEMES=[
  {id:'jarvis',name:'Jarvis HUD',desc:'cyan holographic · default',sw:'#3fd0ff'},
  {id:'arc',name:'Arc Reactor',desc:'deep teal · reactor glow',sw:'#2ee6d0'},
  {id:'mono',name:'Mono',desc:'black & white',sw:'#ffffff'},
  {id:'cb-agent',name:'CB Agent',desc:'dark steel · brand',sw:'#9fb3bf'},
  {id:'voxel',name:'Voxel',desc:'blocky pixel world',sw:'#8bc34a'},
  {id:'dojo',name:'Dojo',desc:'sumi ink · red seal',sw:'#c8442e'},
];
function setTheme(id){
  document.body.dataset.theme=id;
  try{localStorage.setItem('cb-agent_theme',id);}catch(e){}
  renderThemeMenu();
}
function renderThemeMenu(){
  const cur=document.body.dataset.theme;
  $('#themeMenu').innerHTML=THEMES.map(t=>
    `<button class="${t.id===cur?'on':''}" data-theme-id="${t.id}">
       <span class="sw" style="background:${t.sw}"></span>
       <span>${t.name}<small>${t.desc}</small></span></button>`).join('');
  $('#themeMenu').querySelectorAll('button').forEach(b=>b.onclick=()=>setTheme(b.dataset.themeId));
}
try{const saved=localStorage.getItem('cb-agent_theme'); if(saved) document.body.dataset.theme=saved;}catch(e){}
renderThemeMenu();
$('#themeBtn').onclick=e=>{e.stopPropagation(); $('#themeMenu').classList.toggle('open');};
document.addEventListener('click',e=>{
  if(!$('#themeMenu').contains(e.target)&&e.target!==$('#themeBtn')) $('#themeMenu').classList.remove('open');
});

/* ===== rail ===== */
$('#rail').innerHTML=GROUPS.map(g=>
  `<div class="rail-label">${g.group}</div>`+
  g.items.map(c=>`<button data-cmd="${c.cmd}"><span class="code">${c.code}</span><span>${c.name}<small>${c.desc}</small></span></button>`).join('')
).join('')+`<div class="rail-label">History</div><div id="history"></div>`;
document.querySelectorAll('#rail button[data-cmd]').forEach(btn=>{
  btn.onclick=()=>{
    document.querySelectorAll('#rail button').forEach(b=>b.classList.remove('active'));
    btn.classList.add('active');
    pickCmd(btn.dataset.cmd);
  };
});
function triggerCmd(cmd){pickCmd(cmd);}
function goHome(){
  document.querySelectorAll('#rail button').forEach(b=>b.classList.remove('active'));
  opts.hidden=true; opts.innerHTML='';
  renderHome();
  logFeed('home');
  document.getElementById('main').scrollTop=0;
}
function pickCmd(cmd){
  if(OPT_FORMS[cmd]){
    // clear whatever's in the output area (HUD or a previous command's result)
    // so the form isn't stacked on top of stale content
    out.innerHTML='';
    opts.hidden=false; opts.innerHTML=OPT_FORMS[cmd];
    if(cmd==='run_agent') loadAgentNames();
  }
  else if(cmd==='agents'){opts.hidden=true; renderAgentCards();}
  else{opts.hidden=true; runCmd(cmd,{});}
}

/* ===== option forms ===== */
const OPT_FORMS={
  watch:`<input id="o_vsrc" style="width:330px" placeholder="Video URL (YouTube, TikTok, IG, Loom…) or file path">
         <input id="o_vq" style="width:200px" placeholder="What to analyze? (optional)">
         <select id="o_vdetail"><option value="standard" selected>standard</option><option value="quick">quick</option><option value="deep">deep</option><option value="transcript">transcript only</option></select>
         <label style="display:flex;align-items:center;gap:5px;font-family:var(--mono);font-size:10px;color:var(--dim)"><input type="checkbox" id="o_vlog" checked> log to competitors</label>
         <button class="go" onclick="runCmd('watch',{source:v('o_vsrc'),question:v('o_vq'),detail:v('o_vdetail'),log:document.getElementById('o_vlog').checked?1:0})">Analyze</button>`,
  run_agent:`<select id="o_aname"></select>
             <input id="o_atask" style="width:400px" placeholder="What should it do? e.g. plan drop week content">
             <button class="go" onclick="runCmd('run_agent',{name:v('o_aname'),task:v('o_atask')})">Run</button>`,
  ads:`<select id="o_adays"><option selected>7</option><option>30</option></select>
       <button class="go" onclick="runCmd('ads',{days:v('o_adays')})">Analyze</button>`,
  videos:`<select id="o_vcount"><option>25</option><option>50</option><option selected>100</option></select>
          <button class="go" onclick="runCmd('videos',{count:v('o_vcount')})">Generate</button>`,
  debrief:`<input id="o_date" type="date" value="2026-07-30">
           <select id="o_days"><option>1</option><option selected>3</option><option>7</option></select>
           <button class="go" onclick="runCmd('debrief',{date:v('o_date'),days:v('o_days')})">Run debrief</button>`,
  content:`<select id="o_stage"><option>ALL</option><option>TOF</option><option>MOF</option><option>BOF</option></select>
           <select id="o_count"><option>3</option><option selected>5</option><option>8</option></select>
           <input id="o_topic" placeholder="topic (optional)">
           <button class="go" onclick="runCmd('content',{stage:v('o_stage'),count:v('o_count'),topic:v('o_topic')})">Generate</button>`,
  ideas:`<select id="o_lens"><option>ALL</option><option>product</option><option>content</option><option>channels</option><option>community</option><option>retention</option><option>positioning</option><option>ops</option></select>
         <button class="go" onclick="runCmd('ideas',{lens:v('o_lens')})">Scan</button>`,
  advise:`<input id="o_focus" placeholder="focus (optional)">
          <button class="go" onclick="runCmd('advise',{focus:v('o_focus')})">Audit</button>`,
};
const v=id=>document.getElementById(id)?.value||'';

/* populate the subagent dropdown from installed agents */
async function loadAgentNames(){
  const sel=document.getElementById('o_aname'); if(!sel) return;
  sel.innerHTML='<option>loading…</option>';
  try{
    const r=await fetch('/api/agents');
    const list=await r.json();
    sel.innerHTML=list.length
      ? list.map(a=>`<option>${a.name}</option>`).join('')
      : '<option value="">none installed</option>';
  }catch(e){ sel.innerHTML='<option value="">unavailable</option>'; }
}

/* render installed specialists as cards (LST) */
async function renderAgentCards(){
  out.innerHTML=`<div class="running">Loading specialists…</div>`;
  logFeed('exec agents');
  try{
    const list=await (await fetch('/api/agents')).json();
    if(!list.length){
      out.innerHTML=`<div class="dash-title">specialists</div>
        <p style="color:var(--dim)">No subagents installed. Drop Claude Code style
        <code>.md</code> files into the <code>agents/</code> folder.</p>`;
      return;
    }
    out.innerHTML=`<div class="dash-title">installed specialists · ${list.length}</div>
      <div class="agent-grid">${list.map(a=>`
        <div class="agent-card">
          <div class="ac-top">
            <span class="ac-name">${a.name}</span>
            <span class="ac-model">${a.model}</span>
          </div>
          <div class="ac-desc">${(a.description||'').replace(/</g,'&lt;')}</div>
          ${a.tools.length?`<div class="ac-tools">${a.tools.map(t=>`<span>${t}</span>`).join('')}
            <em>persona only — tools run in Claude Code</em></div>`:''}
          <button class="ac-run" onclick="pickCmd('run_agent');setTimeout(()=>{const s=document.getElementById('o_aname');if(s){s.value='${a.name}';document.getElementById('o_atask')?.focus();}},60)">
            Run ${a.name} →</button>
        </div>`).join('')}</div>`;
    logFeed('agents complete');
  }catch(e){ out.innerHTML=`<p style="color:var(--err)">Failed to load specialists: ${e}</p>`; }
}

/* --- JS: run --- */
async function runCmd(command,args){
  out.innerHTML=`<div class="running">Running ${command}…</div>`;
  logFeed(`exec ${command}`);
  setBusy(true);
  try{
    const r=await fetch('/api/run',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({command,args})});
    const {job}=await r.json();
    const text=await poll(job);
    logFeed(`${command} complete`);
    out.innerHTML=md(text);
    const m=text.match(/https:\/\/[^\s)]+preview_theme_id=\d+/);
    if(m) out.insertAdjacentHTML('beforeend',
      `<div style="margin-top:16px">
         <a href="${m[0]}" target="_blank" rel="noopener" style="color:var(--accent);font-family:var(--display);font-weight:700;font-size:12px;text-transform:uppercase">Open preview ↗</a>
         <div style="margin-top:10px;border:1px solid var(--line);border-radius:var(--radius);overflow:hidden;height:460px;background:var(--ink-2)">
           <iframe src="${m[0]}" style="width:100%;height:100%;border:none;background:#fff"></iframe></div></div>`);
    loadHistory();
  }catch(e){
    logFeed(`${command} failed`);
    const lost = String(e).includes('Failed to fetch') || String(e).includes('NetworkError');
    out.innerHTML = lost
      ? `<div class="dash-title">lost connection to the agent</div>
         <p style="color:var(--err)">The Command Center can't reach the agent.</p>
         <p style="color:var(--dim);line-height:1.7">
           This almost always means the black terminal window closed or the agent stopped.<br><br>
           <b>To fix it:</b><br>
           1. Check the black window is still open — if not, double-click
              <b>"2 - START AGENT.bat"</b><br>
           2. Then refresh this page (F5)
         </p>`
      : `<p style="color:var(--err)">Failed: ${e}</p>`;
  }
  setBusy(false);
}
async function poll(job){
  while(true){
    await new Promise(r=>setTimeout(r,1200));
    const j=await (await fetch('/api/job/'+job)).json();
    if(j.status!=='running') return j.output;
  }
}

/* --- JS: chat --- */
async function sendChat(){
  const input=$('#chatInput'),msg=input.value.trim();
  if(!msg) return;
  input.value=''; opts.hidden=true;
  if(out.querySelector('.tiles')) out.innerHTML='';
  out.insertAdjacentHTML('beforeend',`<div class="chat-turn user"><div class="who">you</div><div>${msg.replace(/</g,'&lt;')}</div></div>`);
  setBusy(true);
  try{
    const r=await fetch('/api/chat',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({message:msg})});
    const {job}=await r.json();
    const text=await poll(job);
    out.insertAdjacentHTML('beforeend',`<div class="chat-turn agent"><div class="who">agent</div><div>${md(text)}</div></div>`);
  }catch(e){out.insertAdjacentHTML('beforeend',`<p style="color:var(--err)">Failed: ${e}</p>`);}
  setBusy(false);
  out.scrollTop=out.scrollHeight; $('#main').scrollTop=$('#main').scrollHeight;
}
$('#chatSend').onclick=sendChat;
$('#chatInput').addEventListener('keydown',e=>{if(e.key==='Enter')sendChat();});

/* --- JS: home --- */
function renderHome(){
  const online=Object.values(STATUS).filter(Boolean).length,total=6;
  out.innerHTML=`
    <div class="hud">
      <div class="hudpanel">
        <div class="hp-head"><span>Activity feed</span><i></i></div>
        <div class="feed" id="feed"></div>
        <div class="hp-foot"><span>local session</span><span id="feed-enc">no cloud</span></div>
      </div>

      <div class="orbit">
        <svg viewBox="0 0 200 200" aria-hidden="true">
          <circle class="ring-thin" cx="100" cy="100" r="94"/>
          <circle class="ring-dash" cx="100" cy="100" r="88"/>
          <g class="ring-ticks">${
            Array.from({length:36},(_,i)=>{
              const a=i*10*Math.PI/180, r1=76, r2=i%3===0?68:72;
              return `<line x1="${100+Math.cos(a)*r1}" y1="${100+Math.sin(a)*r1}"
                            x2="${100+Math.cos(a)*r2}" y2="${100+Math.sin(a)*r2}"/>`;
            }).join('')}
          </g>
          <path class="ring-arc" d="M100,38 A62,62 0 0,1 155,72"/>
          <path class="ring-arc" style="animation-duration:21s" d="M100,162 A62,62 0 0,1 45,128"/>
          <circle class="ring-thin" cx="100" cy="100" r="56"/>
        </svg>
        <div class="core-orb" id="orb">
          <svg class="sphere" id="sphere" viewBox="-100 -100 200 200" aria-hidden="true"></svg>
          <div class="orb-label"><b>CB AGENT</b><span>active mode</span></div>
        </div>
      </div>

      <div class="hudpanel">
        <div class="hp-head"><span>System analysis</span><i></i></div>
        <div id="meters"></div>
      </div>
    </div>

    <div class="dash-title">quick actions</div>
    <div class="quick">
      <button onclick="triggerCmd('report')">Run today's brief</button>
      <button onclick="triggerCmd('videos')">100 video ideas</button>
      <button onclick="triggerCmd('run_agent')">Run a specialist</button>
      <button onclick="$('#chatInput').focus()">Ask the agent</button>
    </div>
    <div id="latestWrap"></div>`;

  renderMeters(online,total);
  renderFeed();
  buildSphere();
  fetch('/api/reports').then(r=>r.json()).then(files=>{
    if(!files.length||!$('#latestWrap')) return;
    const f=files[0],nm=f.path.split('/')[1];
    fetch(`/api/report/${f.kind}/${nm}`).then(r=>r.json()).then(j=>{
      const plain=(j.content||'').replace(/[#*`>]/g,'').slice(0,600);
      if($('#latestWrap')) $('#latestWrap').innerHTML=`<div class="dash-title">latest</div>
        <div class="latest" onclick="openReport('${f.kind}','${nm}')">
          <div class="l-head"><span>${f.kind} · ${f.name}</span><span>open →</span></div>
          <div class="l-body">${plain.replace(/</g,'&lt;')}</div></div>`;
    });
  });
}

/* Meters show REAL state, not decorative CPU/RAM numbers. */
function renderMeters(online,total){
  const el=$('#meters'); if(!el) return;
  fetch('/api/reports').then(r=>r.json()).then(files=>{
    const daily=files.filter(f=>f.kind==='daily').length;
    const rows=[
      ['Connectors', online, total, `${online}/${total}`],
      ['Report history', Math.min(daily,14), 14, `${daily}`],
      ['Specialists', AGENT_COUNT, Math.max(AGENT_COUNT,4), `${AGENT_COUNT}`],
    ];
    el.innerHTML=rows.map(([label,val,max,txt])=>`
      <div class="meter">
        <div class="meter-top"><span>${label}</span><b>${txt}</b></div>
        <div class="meter-bar"><i data-w="${Math.round(100*val/(max||1))}"></i></div>
      </div>`).join('');
    requestAnimationFrame(()=>el.querySelectorAll('.meter-bar i')
      .forEach(b=>b.style.width=b.dataset.w+'%'));
  }).catch(()=>{});
}

/* Geodesic dot-sphere for the core — Fibonacci point distribution, orthographic
   projection, depth cued by dot radius and opacity so it reads as a 3D ball. */
function buildSphere(){
  const svg=document.getElementById('sphere'); if(!svg) return;
  const N=520, R=94, GOLDEN=Math.PI*(3-Math.sqrt(5));
  let out='';
  for(let i=0;i<N;i++){
    const y=1-(i/(N-1))*2;
    const r=Math.sqrt(1-y*y);
    const th=GOLDEN*i;
    const x=Math.cos(th)*r, z=Math.sin(th)*r;
    const depth=(z+1)/2;                        // 0 back .. 1 front
    const rad=(0.55+depth*1.15).toFixed(2);
    const op=(0.16+depth*0.8).toFixed(2);
    out+=`<circle cx="${(x*R).toFixed(1)}" cy="${(-y*R).toFixed(1)}" r="${rad}" opacity="${op}"/>`;
  }
  // faint rim ring + inner great circles to structure the surface
  out+=`<circle cx="0" cy="0" r="${R}" fill="none" stroke="var(--accent)" stroke-width="0.6" opacity="0.28"/>`;
  out+=`<ellipse cx="0" cy="0" rx="${R}" ry="${(R*0.34).toFixed(1)}" fill="none" stroke="var(--accent)" stroke-width="0.5" opacity="0.16"/>`;
  out+=`<ellipse cx="0" cy="0" rx="${(R*0.34).toFixed(1)}" ry="${R}" fill="none" stroke="var(--accent)" stroke-width="0.5" opacity="0.16"/>`;
  svg.innerHTML=out;
}

/* Activity feed — real session events, newest last like a console. */
const FEED=[];
function logFeed(msg){
  const t=new Date().toLocaleTimeString([],{hour12:false});
  FEED.push({t,msg});
  if(FEED.length>40) FEED.shift();
  renderFeed();
}
function renderFeed(){
  const el=$('#feed'); if(!el) return;
  el.innerHTML=FEED.slice(-12).map(f=>
    `<div><span class="t">[${f.t}]</span> ${f.msg.replace(/</g,'&lt;')}</div>`).join('')
    || '<div><span class="t">[--:--:--]</span> awaiting input</div>';
  el.scrollTop=el.scrollHeight;
}

  const h=$('#history'); if(!h) return;
  h.innerHTML=files.slice(0,10).map(f=>
    `<button onclick="openReport('${f.kind}','${f.path.split('/')[1]}',this)"><span class="code">${f.kind.slice(0,3).toUpperCase()}</span><span>${f.name}</span></button>`).join('')
    ||`<button disabled><small style="padding-left:8px">no reports yet</small></button>`;
}
async function openReport(kind,name,btn){
  document.querySelectorAll('#rail button').forEach(b=>b.classList.remove('active'));
  if(btn&&btn.classList) btn.classList.add('active');
  opts.hidden=true;
  const j=await (await fetch(`/api/report/${kind}/${name}`)).json();
  out.innerHTML=md(j.content||'');
}
loadHistory();
fetch('/api/agents').then(r=>r.json()).then(a=>{AGENT_COUNT=a.length; renderMeters(

/* --- JS: boot --- */
const boot=$('#boot'),bootlines=$('#bootlines');
let bootDone=false;
function endBoot(){if(bootDone)return; bootDone=true; boot.classList.add('fade'); setTimeout(()=>boot.remove(),750);}
boot.addEventListener('click',endBoot);
const reduced=window.matchMedia('(prefers-reduced-motion: reduce)').matches;
fetch('/api/status').then(r=>r.json()).then(st=>{
  STATUS=st;
  const names={anthropic:'ai',instagram:'ig',tiktok:'tt',meta_ads:'ads',klaviyo:'klv',shopify:'shop'};
  $('#conn').innerHTML=Object.entries(names).map(([k,l])=>`<span class="dot ${st[k]?'on':''}">${l}</span>`).join('');
  renderHome();
  logFeed('initializing system protocols');
  Object.entries(names).forEach(([k,l])=>{ if(st[k]) logFeed(`${l} link established`); });
  logFeed(`${Object.values(st).filter(Boolean).length}/6 systems online`);
  if(reduced){endBoot(); return;}
  const seq=[['CB AGENT v1.0',null],['claude core',st.anthropic],['instagram feed',st.instagram],
    ['tiktok feed',st.tiktok],['meta ads',st.meta_ads],['klaviyo list',st.klaviyo],
    ['shopify store',st.shopify],['— martial arts × streetwear —',null]];
  seq.forEach(([label,on],i)=>setTimeout(()=>{
    const s=on===null?'':on?' <span class="on">online</span>':' <span class="off">standby</span>';
    bootlines.insertAdjacentHTML('beforeend',`<div>${label}${s}</div>`);
  },350+i*260));
  setTimeout(endBoot,350+seq.length*260+900);
}).catch(()=>{renderHome(); endBoot();});
setTimeout(endBoot,6000);

/* --- JS: palette --- */
const pal=$('#pal'),palInput=$('#palInput'),palList=$('#pal-list');
let palSel=0;
function openPal(){pal.classList.add('open'); palInput.value=''; renderPal(''); palInput.focus();}
function closePal(){pal.classList.remove('open');}
function renderPal(q){
  const items=[...COMMANDS,...THEMES.map(t=>({cmd:'theme:'+t.id,code:'THM',name:'Theme: '+t.name,desc:t.desc}))]
    .filter(c=>(c.name+c.code+c.desc).toLowerCase().includes(q.toLowerCase()));
  palSel=Math.min(palSel,Math.max(0,items.length-1));
  palList.innerHTML=items.map((c,i)=>
    `<div class="${i===palSel?'sel':''}" data-cmd="${c.cmd}"><span class="code">${c.code}</span>${c.name}<small>${c.desc}</small></div>`).join('')||`<div><small>no match</small></div>`;
  palList.querySelectorAll('div[data-cmd]').forEach(el=>el.onclick=()=>{closePal(); dispatchPal(el.dataset.cmd);});
}
function dispatchPal(cmd){cmd.startsWith('theme:')?setTheme(cmd.slice(6)):triggerCmd(cmd);}
document.addEventListener('keydown',e=>{
  if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==='k'){e.preventDefault(); pal.classList.contains('open')?closePal():openPal();}
  if(!pal.classList.contains('open')) return;
  if(e.key==='Escape') closePal();
  const items=[...palList.querySelectorAll('div[data-cmd]')];
  if(e.key==='ArrowDown'){e.preventDefault(); palSel=Math.min(palSel+1,items.length-1); renderPal(palInput.value);}
  if(e.key==='ArrowUp'){e.preventDefault(); palSel=Math.max(palSel-1,0); renderPal(palInput.value);}
  if(e.key==='Enter'&&items[palSel]){closePal(); dispatchPal(items[palSel].dataset.cmd);}
});
palInput.addEventListener('input',()=>{palSel=0; renderPal(palInput.value);});
pal.addEventListener('click',e=>{if(e.target===pal) closePal();});
$('#palHint').onclick=openPal;
$('#homeBtn').onclick=goHome;
$('#brandHome').onclick=goHome;
</script>
